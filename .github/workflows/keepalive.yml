name: Keep Render awake

# Free Render web services sleep after ~15 min without inbound traffic. This pings /health every 5 minutes.
# GitHub's scheduler can drift, so ALSO add an UptimeRobot (or cron-job.org) monitor on the same URL.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 60 https://deriv-mcp.onrender.com/health || true)
            echo "attempt $i -> HTTP $code"; cat /tmp/h.json 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 0
