name: Strategy monitor tests

on:
  push:
    branches: [main, feature/strategy-telegram-monitor, validation/replay-2026-10-28]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run strategy tests
        run: python -m unittest discover -s tests -v
      - name: Replay recent XAUUSD snapshot (configured spread)
        run: python scripts/validate_strategy.py data/validation/frxxauusd_2026-10-28.json
